{{ $config := .config | default dict }}
{{ $classes := slice "hb-card-view" "hb-card-view--study" }}
{{ with $config.class }}
  {{ $classes = $classes | append . }}
{{ end }}
{{ $gridClass := "hb-card-grid" }}
{{ with $config.grid_class }}
  {{ $gridClass = printf "%s %s" $gridClass . }}
{{ end }}
<section class="{{ delimit $classes " " }}">
  <div class="{{ $gridClass }}">
